[package]
name = "lowdown-rs"
version = "0.1.0"
edition = "2024"
description = "Read-only terminal companion for following Codex sessions"
license = "MIT"

[[bin]]
name = "lowdown"
path = "src/main.rs"

[[bin]]
name = "lowdown-rs"
path = "src/bin/lowdown-rs.rs"

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde", "std"] }
clap = { version = "4.5", features = ["derive"] }
crossterm = "0.29"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache", "underline-color", "unstable-rendered-line-info"] }
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha1 = "0.10"
tempfile = "3.15"
walkdir = "2.5"
unicode-width = "0.2"
textwrap = "0.16"

[dev-dependencies]
portable-pty = "0.9"
vt100 = "0.15"
vte = "0.11"

[profile.release]
lto = "thin"
strip = true
